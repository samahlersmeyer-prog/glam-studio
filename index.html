<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Glam Studio">
<meta name="theme-color" content="#fff3f8">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Glam Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one-screen toy app, chunky sticker buttons with plum outlines; stage on top, controls below */
:root{
  --bg:#fff3f8; --ink:#3a1f4d; --pink:#ff4fa3; --pinkSoft:#ffd6e8; --mint:#5fd3a8;
  --sun:#ffd23f; --sky:#6cc4ff; --card:#ffffff; --muted:#7d5f90; --line:#f3cfe2;
  --fd:'Baloo 2','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --fb:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;
  background-image:radial-gradient(var(--line) 1.6px,transparent 1.7px);background-size:22px 22px}
#app{height:100%;max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{height:100%;display:flex;flex-direction:column;gap:12px;padding-block:12px;min-height:0}
h1,h2,h3{font-family:var(--fd);margin:0;line-height:1.05;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.btn{font-family:var(--fd);font-weight:800;font-size:1.15rem;border:3px solid var(--ink);border-radius:18px;background:var(--sun);color:var(--ink);padding:10px 18px;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.pink{background:var(--pink);color:#fff}
.btn.mint{background:var(--mint)}
.btn.white{background:var(--card)}
.btn.big{font-size:1.35rem;padding:12px 18px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.iconbtn{width:44px;height:44px;flex:0 0 44px;border:3px solid var(--ink);border-radius:14px;background:var(--card);box-shadow:0 3px 0 var(--ink);font-family:var(--fd);font-weight:800;font-size:1.5rem;line-height:1}
.topbar{display:flex;align-items:center;gap:10px}
.topbar .grow{flex:1;min-width:0}
.starpill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:3px solid var(--ink);border-radius:999px;padding:4px 12px 4px 8px;font-family:var(--fd);font-weight:800;font-size:1.15rem;box-shadow:0 3px 0 var(--ink)}
.starpill svg{width:22px;height:22px}

/* Home */
.brand{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-top:6px}
.brand h1{font-size:clamp(2.6rem,12vw,3.6rem);font-weight:800;color:var(--pink);-webkit-text-stroke:2px var(--ink);text-shadow:0 4px 0 var(--ink);letter-spacing:.01em}
.brand p{margin:6px 0 0;font-weight:800;color:var(--muted)}
.tiles{display:flex;flex-direction:column;gap:14px;flex:1;min-height:0;justify-content:center;overflow-y:auto;padding:2px 2px 8px}
.tile{display:flex;align-items:center;gap:14px;text-align:left;border:3px solid var(--ink);border-radius:26px;padding:14px;box-shadow:0 7px 0 var(--ink);transition:transform .08s,box-shadow .08s;min-height:124px;flex:0 0 auto}
.tile:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.tile h2{font-size:1.9rem;font-weight:800}
.tile p{margin:4px 0 0;font-weight:700;line-height:1.3}
.tile .art{flex:0 0 96px;height:110px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tile .art svg,.tile .art canvas{height:110px;width:auto;max-width:96px;display:block}
.tile .txt{min-width:0}
.t-run{background:linear-gradient(160deg,#ffd6e8,#ffb3d1)}
.t-case{background:linear-gradient(160deg,#d6f7ea,#a8ecd2)}
.t-decor{background:linear-gradient(160deg,#ece4ff,#d2c2ff)}
.linkbtn{align-self:center;border:none;background:none;font-family:var(--fd);font-weight:800;font-size:1.15rem;color:var(--ink);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px;text-decoration-color:var(--pink);padding:8px}

/* Theme reveal */
.center{justify-content:center;align-items:stretch}
.themeCard{background:var(--card);border:3px solid var(--ink);border-radius:28px;box-shadow:0 7px 0 var(--ink);padding:26px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.themeCard .kicker{font-family:var(--fd);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-size:.95rem}
.ticon{font-size:4.4rem;line-height:1;width:120px;height:120px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--ink)}
.themeCard h2{font-size:2.3rem;font-weight:800}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{background:var(--pinkSoft);border:2px solid var(--ink);border-radius:999px;padding:2px 10px;font-weight:800;font-size:.9rem}
.spin .ticon{animation:wob .18s linear infinite}
@keyframes wob{50%{transform:rotate(8deg) scale(1.06)}}

/* Studio */
.themechip{font-family:var(--fd);font-weight:800;font-size:1.05rem;line-height:1.1;min-width:0}
.themechip small{display:block;font-family:var(--fb);font-weight:800;font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{flex:0 0 auto;height:clamp(210px,38vh,400px);border:3px solid var(--ink);border-radius:24px;position:relative;overflow:hidden;box-shadow:0 5px 0 var(--ink)}
.stage::after{content:"";position:absolute;left:10%;right:10%;bottom:4%;height:12%;background:rgba(58,31,77,.18);border-radius:50%;filter:blur(2px)}
#model{position:absolute;inset:4% 0 3%;display:flex;justify-content:center;z-index:1}
#model svg{height:100%;width:auto}
.pop{animation:popin .25s ease}
@keyframes popin{40%{transform:scale(1.04)}}
.tabs{display:flex;gap:6px;overflow-x:auto;flex:0 0 auto;padding:2px 2px 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:3px solid var(--ink);border-radius:14px;background:var(--card);padding:6px 12px;font-family:var(--fd);font-weight:800;font-size:1.02rem;box-shadow:0 3px 0 var(--ink)}
.tab.on{background:var(--pink);color:#fff}
.opts{flex:1 1 auto;min-height:110px;overflow-y:auto;background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:10px 12px 14px;display:flex;flex-direction:column;gap:12px}
.sec h3{font-size:1rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.opt{border:2.5px solid var(--line);border-radius:16px;background:#fff9fc;padding:4px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:.78rem;line-height:1.1}
.opt svg{width:100%;height:62px}
.opt .none{height:62px;display:grid;place-items:center;font-size:1.9rem;color:var(--muted)}
.opt.on{border-color:var(--ink);background:var(--pinkSoft);box-shadow:0 3px 0 var(--ink)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid var(--line);background:var(--c);position:relative;padding:0}
.sw.on{border-color:var(--ink);box-shadow:0 0 0 3px var(--card),0 0 0 6px var(--pink)}
.sw.nil{background:repeating-linear-gradient(45deg,#fff 0 6px,#f3cfe2 6px 9px)}
.sw.rainbow{background:conic-gradient(#ff595e,#ffca3a,#8ac926,#1982c4,#6a4c93,#ff595e)}
.sw.wide{width:auto;border-radius:14px;padding:0 12px;font-weight:800;font-size:.85rem;height:42px}

/* Show */
.runway{flex:1 1 auto;min-height:200px;border:3px solid var(--ink);border-radius:24px;position:relative;overflow:hidden;box-shadow:0 5px 0 var(--ink)}
.runway .floor{position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.2));border-top:3px solid rgba(58,31,77,.35)}
#walker{position:absolute;inset:6% 0 4%;display:flex;justify-content:center;z-index:1}
#walker svg{height:100%;width:auto}
.walking{animation:strut 1.5s cubic-bezier(.3,.7,.3,1) both}
@keyframes strut{0%{transform:translateX(110%) rotate(3deg)}25%{transform:translateX(70%) rotate(-3deg)}50%{transform:translateX(35%) rotate(3deg)}75%{transform:translateX(8%) rotate(-2deg)}100%{transform:none}}
.pose{animation:pose .5s ease}
@keyframes pose{50%{transform:scale(1.06) rotate(-3deg)}}
.flash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 20% 20%,#fff 0 2%,transparent 3%),radial-gradient(circle at 80% 30%,#fff 0 1.5%,transparent 2.5%),radial-gradient(circle at 60% 12%,#fff 0 1.5%,transparent 2.5%);opacity:0}
.flashing{animation:flash 1.6s ease 1.4s}
@keyframes flash{10%,30%,50%{opacity:1}20%,40%,60%{opacity:.2}100%{opacity:0}}
.judges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;flex:0 0 auto}
.judge{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.judge .face{width:58px;height:58px;border:3px solid var(--ink);border-radius:50%;background:var(--card);overflow:hidden}
.judge .face svg{width:100%;height:100%}
.judge .name{font-family:var(--fd);font-weight:800;font-size:.9rem;line-height:1}
.paddle{width:62px;height:62px;perspective:400px}
.pin{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,1.5,.5,1);transform-style:preserve-3d}
.paddle.flip .pin{transform:rotateY(180deg)}
.pf,.pb{position:absolute;inset:0;border:3px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-family:var(--fd);font-weight:800;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.pf{background:var(--card);font-size:1.8rem;color:var(--muted)}
.pb{background:var(--sun);font-size:2rem;transform:rotateY(180deg);font-variant-numeric:tabular-nums}
.bubble{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:4px 6px;font-size:.78rem;font-weight:800;line-height:1.2;min-height:2.6em;opacity:0;transform:translateY(4px);transition:.3s}
.bubble.in{opacity:1;transform:none}
.result{background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);padding:12px;display:flex;flex-direction:column;gap:10px;text-align:center}
.result h2{font-size:1.8rem;font-weight:800}
.scoreline{display:flex;justify-content:center;gap:18px;font-weight:800;font-variant-numeric:tabular-nums}
.scoreline b{font-family:var(--fd);font-size:1.6rem;display:block;line-height:1}
.scoreline .you b{color:var(--pink)}

/* Case studio */
.caseWrap{flex:1 1 auto;min-height:180px;display:flex;justify-content:center;align-items:center;position:relative}
#caseCv{height:100%;max-height:100%;width:auto;max-width:100%;touch-action:none;display:block}
.tools{display:flex;gap:6px;overflow-x:auto;flex:0 0 auto;padding:2px 2px 6px;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tool{flex:0 0 auto;width:64px;border:3px solid var(--ink);border-radius:16px;background:var(--card);padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:0;box-shadow:0 3px 0 var(--ink);font-weight:800;font-size:.72rem}
.tool span{font-size:1.5rem;line-height:1.3}
.tool.on{background:var(--mint)}
.panel{flex:0 0 auto;max-height:27vh;overflow-y:auto;background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.panel .hint{margin:0;font-weight:800;color:var(--muted);font-size:.85rem}
.emo{width:48px;height:48px;border-radius:14px;border:2.5px solid var(--line);background:#fff9fc;font-size:1.7rem;line-height:1;padding:0}
.emo.on{border-color:var(--ink);background:var(--pinkSoft)}
.pourbtn{height:48px;border-radius:14px;border:3px solid var(--ink);padding:0 12px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.55)}
.shapes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;flex:1;align-content:center}
.shapeBtn{border:3px solid var(--ink);border-radius:22px;background:var(--card);box-shadow:0 5px 0 var(--ink);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--fd);font-weight:800;font-size:1.15rem}
.shapeBtn canvas{height:150px;width:auto}
.doneImg{flex:1 1 auto;min-height:0;display:flex;justify-content:center}
.doneImg img{height:100%;width:auto;max-width:100%;object-fit:contain}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;overflow-y:auto;flex:1;min-height:0;align-content:start;padding:4px}
.gcard{background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:center;box-shadow:0 4px 0 var(--ink)}
.gcard img{width:100%;height:auto}
.gcard button{border:2px solid var(--ink);border-radius:10px;background:var(--card);font-weight:800;font-size:.8rem;padding:4px 10px}
.gcard button.sure{background:#d7263d;color:#fff}
.starpill.sm{font-size:1rem;padding:2px 9px 2px 6px;flex:0 0 auto}.starpill.sm svg{width:18px;height:18px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:#fff;font-weight:800;padding:10px 16px;border-radius:16px;box-shadow:0 4px 0 rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center}
.toast.in{animation:toastIn .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes toastIn{from{transform:translate(-50%,20px);opacity:0}}
.opt,.sw{position:relative}
.opt.locked svg{filter:grayscale(.85) opacity(.5)}
.opt.locked span{color:var(--muted)}
.lock{position:absolute;top:3px;right:3px;background:var(--sun);border:2px solid var(--ink);border-radius:999px;font-size:.7rem;font-weight:800;padding:0 5px;line-height:1.4;white-space:nowrap}
.sw.locked::after{content:"";position:absolute;inset:0;border-radius:inherit;background:rgba(255,255,255,.55)}
.sw.locked .lock{top:auto;bottom:-8px;right:-8px;z-index:1;padding:0 4px}
.prize{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--pinkSoft);border:2px dashed var(--pink);border-radius:14px;padding:6px 10px;font-weight:800}
.pchip{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;border:3px solid var(--ink);border-radius:999px;background:var(--card);padding:5px 14px 5px 6px;box-shadow:0 3px 0 var(--ink);font-family:var(--fd);font-size:1.1rem}
.pchip .dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink)}
.pchip .sw2{font-family:var(--fb);font-weight:800;font-size:.8rem;color:var(--muted)}
.ptitle{font-size:clamp(2.2rem,10vw,3rem);font-weight:800;color:var(--pink);-webkit-text-stroke:2px var(--ink);text-shadow:0 4px 0 var(--ink);text-align:center;padding-top:10px}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-content:start;overflow-y:auto;flex:1;min-height:0;padding:6px 2px 10px}
.pcard{border:3px solid var(--ink);border-radius:24px;background:var(--card);box-shadow:0 6px 0 var(--ink);overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 8px 12px;text-align:center;min-width:0}
button.pcard:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.pcard .band{align-self:stretch;margin:0 -8px;height:150px;background:var(--pc);display:flex;justify-content:center;align-items:flex-end;overflow:hidden}
.pcard .band svg{height:250px;width:auto;margin-bottom:-100px}
.pcard b{font-family:var(--fd);font-size:1.4rem;line-height:1.1;max-width:100%;overflow-wrap:anywhere}
.pcard small{font-weight:800;color:var(--muted)}
.pcard.add{justify-content:center;min-height:220px;font-family:var(--fd);font-weight:800;font-size:1.3rem;background:#fff9fc;border-style:dashed}
.pcard.add .plus{font-size:3rem;line-height:1;color:var(--pink)}
.pcard input{width:100%;font:inherit;font-weight:800;font-size:1.1rem;border:2.5px solid var(--ink);border-radius:12px;padding:6px 8px;text-align:center;background:#fff;color:var(--ink)}
.pcard .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pcard .acts button{border:2px solid var(--ink);border-radius:10px;background:var(--card);font-weight:800;font-size:.85rem;padding:4px 10px}
.pcard .acts button.go{background:var(--mint)}
.pcard .acts button.sure{background:#d7263d;color:#fff}
.modes{display:flex;gap:8px;flex:0 0 auto}
.mode{flex:1;border:3px solid var(--ink);border-radius:16px;background:var(--card);padding:8px 6px;font-family:var(--fd);font-weight:800;font-size:1.02rem;box-shadow:0 3px 0 var(--ink)}
.mode.on{background:var(--sun)}
.shapes{overflow-y:auto;min-height:0;padding:4px 2px 8px}
.shapeBtn canvas{height:130px}
.phaseT{font-size:1.35rem;font-weight:800}
.prog{height:18px;border:3px solid var(--ink);border-radius:999px;background:#fff9fc;overflow:hidden}
.prog div{height:100%;background:linear-gradient(90deg,var(--mint),var(--sky));transition:width .2s}
.emo.sten svg{width:30px;height:30px}
.pourbtn.onb{box-shadow:0 0 0 3px var(--card),0 0 0 6px var(--pink)}
.jobs{display:flex;flex-direction:column;gap:12px;overflow-y:auto;flex:1;min-height:0;padding:4px 2px 10px}
.jcard{display:flex;gap:12px;align-items:center;text-align:left;border:3px solid var(--ink);border-radius:22px;background:var(--card);box-shadow:0 5px 0 var(--ink);padding:10px}
.jcard:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.jcard.home{background:linear-gradient(160deg,#fff3c2,#ffe08a)}
.jart{flex:0 0 76px;height:76px;border-radius:18px;border:2.5px solid var(--ink);background:var(--pinkSoft);display:grid;place-items:center;font-size:2.6rem;overflow:hidden}
.jart.face svg{width:100%;height:100%}
.jtxt{display:flex;flex-direction:column;gap:2px;min-width:0}
.jtxt b{font-family:var(--fd);font-size:1.25rem;line-height:1.1}
.jtxt span{font-weight:700;font-size:.85rem;color:var(--muted);line-height:1.25}
.jst{font-size:1.2rem!important;letter-spacing:2px}.jst i{font-style:normal;color:#e3d6ef}.jst i.on{color:#f0b81e;-webkit-text-stroke:1px var(--ink)}
.dstep{font-family:var(--fd);font-weight:800;font-size:.98rem;line-height:1.15}
.d3wrap{flex:1 1 auto;min-height:220px;position:relative;border:3px solid var(--ink);border-radius:24px;overflow:hidden;background:linear-gradient(#f7f1ff,#efe4ff);box-shadow:0 5px 0 var(--ink)}
.d3c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.dload{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:1.2rem;color:var(--muted);text-align:center;padding:20px}
.dctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px;z-index:2}
.dbtn{width:52px;height:52px;border-radius:50%;border:3px solid var(--ink);background:var(--card);box-shadow:0 3px 0 var(--ink);font-size:1.5rem;font-weight:800;line-height:1}
.dpanel{flex:0 0 auto;max-height:36vh;overflow-y:auto;background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.dpanel .hint{margin:0;font-weight:800;color:var(--muted);font-size:.9rem}.dpanel .hint b{color:var(--ink)}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bin{border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);padding:8px;font-family:var(--fd);font-weight:800;font-size:1.15rem;display:flex;flex-direction:column;align-items:center}
.bin span{font-size:2rem;line-height:1.2}.bin.trash{background:#e9e4ef}.bin.keep{background:#ffe3b8}.bin:disabled{opacity:.45;box-shadow:0 2px 0 var(--ink)}
.dopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.dopt{border:2.5px solid var(--line);border-radius:16px;background:#fff9fc;padding:5px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:800;font-size:.8rem;line-height:1.1;text-align:center}
.dopt img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:11px;display:block}
.dopt.on{border-color:var(--ink);background:var(--pinkSoft);box-shadow:0 3px 0 var(--ink)}
.dopts.inv .dopt img{object-fit:contain;background:#f7f1ff}
.dres{display:flex;gap:12px;align-items:center}
.dclient{flex:0 0 84px;height:104px;border:3px solid var(--ink);border-radius:18px;overflow:hidden;background:var(--pinkSoft)}.dclient svg{width:100%;height:100%}
.dsay b{font-family:var(--fd);font-size:1.3rem}.dsay p{margin:2px 0 4px;font-weight:700;line-height:1.3}
.dstars span{font-size:2.2rem;color:#e3d6ef;line-height:1}.dstars span.on{color:#f0b81e;-webkit-text-stroke:1.5px var(--ink)}
.dtabs{display:flex;gap:6px}
body.wide #app{max-width:1100px}
.empty{text-align:center;font-weight:800;color:var(--muted);padding:30px 10px;line-height:1.4}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>

<div id="app">
  <!-- HOME -->

      <button class="tile t-decor" id="goDecor"><div class="art"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M8 32 50 12 50 52 8 72Z" fill="#ffd6e4" stroke="#3a1f4d" stroke-width="2.4" stroke-linejoin="round"/><path d="M50 12 92 32 92 72 50 52Z" fill="#e6ddff" stroke="#3a1f4d" stroke-width="2.4" stroke-linejoin="round"/><path d="M8 72 50 52 92 72 50 92Z" fill="#d9a66c" stroke="#3a1f4d" stroke-width="2.4" stroke-linejoin="round"/><path d="M62 30 80 39 80 54 62 45Z" fill="#9fd8ff" stroke="#fff" stroke-width="2"/><path d="M22 40 34 34 34 46 22 52Z" fill="#fff3b0" stroke="#e9b949" stroke-width="1.5"/><path d="M36 66 54 57 70 65 52 74Z" fill="#ff9ac8" stroke="#3a1f4d" stroke-width="1.6"/><path d="M36 66 52 74 52 79 36 71Z" fill="#e06aa5" stroke="#3a1f4d" stroke-width="1.6"/><path d="M52 74 70 65 70 70 52 79Z" fill="#c9528c" stroke="#3a1f4d" stroke-width="1.6"/><path d="M40 61 50 56 54 58 44 63Z" fill="#fff"/></svg></div><div class="txt"><h2>Dream Rooms</h2><p>Fix up rooms for clients, then design your own.</p></div></button>
    </div>

      <div class="starpill sm" aria-label="Stars"><svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.8-6.3 3.8 1.7-7L2 9.2l7.1-.6z" fill="#ffd23f" stroke="#3a1f4d" stroke-width="1.8" stroke-linejoin="round"/></svg><span class="starsNow">0</span></div>

  <!-- DREAM ROOMS -->
  <section id="decorMap" class="screen" hidden>

<script>
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
let AC=null;
function tone(f=660,d=.08,type='sine',v=.07){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d+.03)}catch(e){}}
function fanfare(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.18,'triangle',.08),i*120))}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.hidden=s.id!==id);if(id!=='caseStudio')caseActive=false;if(id!=='decor'&&typeof DR!=='undefined'&&DR)DR.active=false;document.body.classList.toggle('wide',id==='decor');if(id==='home')renderHome()}
document.addEventListener('click',e=>{if(e.target.closest('[data-home]')){tone(440);show('home')}});
/* ---------- players ---------- */
const PCOL=['#ff4fa3','#5fd3a8','#6cc4ff','#ffd23f','#b9a3ff','#ff8a65'];
let PROFILES=store.get('glam_profiles',null),CURP=store.get('glam_current',null);
if(!PROFILES){ // first run with players: copy any earlier progress to each girl
 PROFILES=[{id:'p1',name:'Junie',c:0},{id:'p2',name:'Josie',c:1}];
 const legacy={stars:store.get('glam_stars',null),look:store.get('glam_look',null),unlocked:store.get('glam_unlocked',null),cases:store.get('glam_cases',null)};
 PROFILES.forEach(p=>{for(const k in legacy)if(legacy[k]!=null)store.set(`glam_${p.id}_${k}`,legacy[k])});
 store.set('glam_profiles',PROFILES);
}
{let ch=false;PROFILES.forEach(p=>{const nn={June:'Junie',Josephine:'Josie'}[p.name];if(nn){p.name=nn;ch=true}});if(ch)store.set('glam_profiles',PROFILES)} // the girls go by Junie and Josie
if(!PROFILES.find(p=>p.id===CURP))CURP=PROFILES[0].id;
const K=n=>`glam_${CURP}_${n}`;
let stars=store.get(K('stars'),0);
function addStars(n){stars+=n;store.set(K('stars'),stars);updStars()}
function updStars(){document.querySelectorAll('.starsNow').forEach(e=>e.textContent=stars)}
let toastT=null;function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;t.classList.remove('in');void t.offsetWidth;t.classList.add('in');clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}

/* ---------- color + svg helpers ---------- */
function sh(hex,p){let n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;const f=p<0?0:255,a=Math.abs(p);r=Math.round(r+(f-r)*a);g=Math.round(g+(f-g)*a);b=Math.round(b+(f-b)*a);return'#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}
const O=c=>`fill="${c}" stroke="${sh(c,-.3)}" stroke-width="1.1" stroke-linejoin="round"`;
function starPts(cx,cy,r,ri=r*.45,n=5){let p='';for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n,rr=i%2?ri:r;p+=(i?'L':'M')+(cx+rr*Math.cos(a)).toFixed(1)+' '+(cy+rr*Math.sin(a)).toFixed(1)}return p+'Z'}
const STAR=(cx,cy,r,f,x='')=>`<path d="${starPts(cx,cy,r)}" fill="${f}" ${x}/>`;
const HEART=(cx,cy,s,f,x='')=>`<path d="M${cx} ${cy+s*.9}C${cx-s*1.6} ${cy-s*.2} ${cx-s*.6} ${cy-s*1.3} ${cx} ${cy-s*.4}C${cx+s*.6} ${cy-s*1.3} ${cx+s*1.6} ${cy-s*.2} ${cx} ${cy+s*.9}Z" fill="${f}" ${x}/>`;
const MIR=s=>`<g transform="translate(200 0) scale(-1 1)">${s}</g>`;
const BOTH=s=>s+MIR(s);

/* ---------- data ---------- */
const COLORS=[['Hot Pink','#ff4fa3',['bold','bright','cute']],['Bubblegum','#ffb3d1',['pastel','cute']],['Ruby','#d7263d',['bold','fancy','royal']],['Coral','#ff8a65',['summer','bright']],['Sunshine','#ffd23f',['summer','bright','sporty']],['Mint','#7fe0b8',['pastel','garden','summer']],['Teal','#1fb5a8',['summer','sporty','cool']],['Sky','#6cc4ff',['summer','winter','pastel']],['Royal Blue','#3456d1',['royal','sporty','bold']],['Lavender','#b9a3ff',['pastel','garden','royal']],['Grape','#8a3fd1',['royal','bold','cool']],['Snow','#fbfaff',['winter','fancy','pastel']],['Midnight','#2b2233',['cool','bold']],['Gold','#e9b949',['fancy','sparkle','royal']],['Silver','#c9d1dc',['sparkle','winter','cool']],['Denim','#4a6fa5',['casual','cool']]].map(([n,c,t])=>({n,c,t}));
const SKINS=['#ffe0c7','#f5c9a2','#e3a676','#c68650','#8d5a34','#5c3a21'];
const HAIRC=[{n:'Chocolate',c:'#5a3420'},{n:'Black',c:'#231a1a'},{n:'Blonde',c:'#f2c94c',t:['summer']},{n:'Ginger',c:'#d9622b'},{n:'Pink',c:'#ff7ac0',t:['bold','cute']},{n:'Blue',c:'#4f8cff',t:['bold','cool']},{n:'Lavender',c:'#b79cff',t:['pastel','garden']},{n:'Silver',c:'#d6dbe4',t:['winter','sparkle']}];
const EYES=[{n:'None',c:null},{n:'Pink',c:'#ff7ac0',t:['cute']},{n:'Sky',c:'#6cc4ff',t:['winter','summer']},{n:'Purple',c:'#9b5de5',t:['royal','bold']},{n:'Gold',c:'#e9b949',t:['sparkle','fancy']},{n:'Mint',c:'#5fd3a8',t:['garden']}];
const LIPS=[{n:'Natural',c:null},{n:'Pink',c:'#ff5fa2',t:['cute']},{n:'Red',c:'#d7263d',t:['fancy','bold']},{n:'Coral',c:'#ff7f5c',t:['summer']},{n:'Berry',c:'#9b2c6f',t:['cool','winter']}];
const BLUSH=[{n:'None',c:null},{n:'Rosy',c:'#ff6f91',t:['cute','winter']},{n:'Peach',c:'#ffa07a',t:['summer','garden']}];

/* ---------- art kit ---------- */
let CUR='s0',UID=0;
const mix=(a,b,t)=>{const p=h=>{const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255]};const A=p(a),B=p(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')};
function DEFS(){const g=CUR;return `<defs><linearGradient id="${g}v" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".32"/><stop offset=".3" stop-color="#fff" stop-opacity="0"/><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".26"/></linearGradient><linearGradient id="${g}d" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".22"/></linearGradient><radialGradient id="${g}s" cx=".38" cy=".3" r=".78"><stop offset="0" stop-color="#fff" stop-opacity=".26"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".16"/></radialGradient><linearGradient id="${g}h" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".3" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></linearGradient><linearGradient id="${g}gold" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff6bf"/><stop offset=".45" stop-color="#f0c24e"/><stop offset="1" stop-color="#a87a22"/></linearGradient><filter id="${g}blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4"/></filter><filter id="${g}soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation=".9"/></filter><radialGradient id="${g}b" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>`}
function svgWrap(vb,fn,attrs=''){CUR='s'+(++UID);const inner=fn();return `<svg viewBox="${vb}" ${attrs}>${DEFS()}${inner}</svg>`}
const G=k=>`url(#${CUR}${k})`;
const V=(d,c)=>`<path d="${d}" ${O(c)}/><path d="${d}" fill="${G('v')}"/>`;
const VD=(d,c)=>V(d,c)+`<path d="${d}" fill="${G('d')}"/>`;
const HV=(d,c)=>`<path d="${d}" ${O(c)}/><path d="${d}" fill="${G('h')}"/><path d="${d}" fill="${G('v')}" opacity=".6"/>`;
const FOLD=(d,c,w=1.3,o=.55)=>`<path d="${d}" stroke="${sh(c,-.4)}" stroke-opacity="${o}" stroke-width="${w}" fill="none" stroke-linecap="round"/>`;
const HI=(d,w=2,o=.45)=>`<path d="${d}" stroke="#fff" stroke-opacity="${o}" stroke-width="${w}" fill="none" stroke-linecap="round"/>`;
let KC=0;
const HVS=(d,c,ds)=>{const id=CUR+'k'+(++KC);return HV(d,c)+`<clipPath id="${id}"><path d="${d}"/></clipPath><g clip-path="url(#${id})">${STR(c,ds)}</g>`};
const STR=(c,ds)=>ds.map((d,i)=>{const hi=i%3===2;return `<path d="${d}" stroke="${hi?sh(c,.5):sh(c,-.35)}" stroke-opacity="${hi?.65:.5}" stroke-width="${hi?1.6:1.1}" fill="none" stroke-linecap="round"/>`}).join('');
const CIRC=(x,y,r)=>`M${x-r} ${y}a${r} ${r} 0 1 0 ${2*r} 0a${r} ${r} 0 1 0 ${-2*r} 0Z`;
const SEQ=(pts,c)=>pts.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="${i%3?1.4:2}" fill="${i%2?'#fff':sh(c,.55)}" opacity=".9"/>`).join('');
const grid=(x0,x1,y0,y1,step)=>{const p=[];for(let y=y0;y<=y1;y+=step)for(let x=x0+((y-y0)/step%2?step/2:0);x<=x1;x+=step)p.push([x,y]);return p};

/* ---------- hair ---------- */
const F_CENTER='M68 80Q60 26 100 20Q140 26 132 80Q128 54 114 40Q106 34 100 33Q94 34 86 40Q72 54 68 80Z';
const F_SWEPT='M68 78Q60 26 98 20Q140 18 134 74Q130 56 122 46Q110 40 98 46Q84 54 74 62Q70 68 68 78Z';
const F_SLEEK='M69 66Q66 24 100 22Q134 24 131 66Q126 40 100 36Q74 40 69 66Z';
const F_BLUNT='M68 74Q62 22 100 20Q138 22 132 74Q130 62 127 56L73 56Q70 62 68 74Z';
const fCenter=c=>HVS(F_CENTER,c,['M100 34Q86 40 76 58','M100 34Q114 40 124 58','M98 28Q84 34 74 50','M98 36Q84 46 74 68','M102 36Q118 46 126 68','M102 28Q116 32 126 48']);
const fSwept=c=>HVS(F_SWEPT,c,['M122 30Q100 34 80 56','M126 40Q106 40 74 66','M114 26Q92 28 76 46','M128 54Q126 40 112 30']);
const fSleek=c=>HVS(F_SLEEK,c,['M100 24Q84 30 72 56','M100 24Q116 30 128 56','M100 24Q92 28 82 40','M100 26Q110 30 118 40']);
const LOCK_L='M71 70Q62 104 64 140Q66 160 77 172Q72 146 74 116Q76 92 75 74Z';
const LOCKW_L='M71 70Q60 92 70 112Q60 132 68 152Q64 166 75 176Q72 160 78 148Q72 130 80 112Q72 92 76 74Z';
function braid(c){let s='';for(let i=0;i<11;i++){const y=86+i*11,x=73+i*.8+(i%2?2:-2);s+=`<ellipse cx="${x}" cy="${y}" rx="7.6" ry="6.6" transform="rotate(${i%2?28:-28} ${x} ${y})" ${O(c)}/><path d="M${x-4} ${y-2}Q${x} ${y-5} ${x+4} ${y-2}" stroke="${sh(c,.45)}" stroke-opacity=".7" stroke-width="1.4" fill="none"/>`}
 return s+`<path d="M78 204L84 206L82 210L76 208Z" fill="#ff4fa3"/><path d="M76 209Q72 222 80 226Q86 222 82 209Z" ${O(c)}/>`}
const curl=(x,y,c)=>`<path d="M${x-5} ${y+1}Q${x-2} ${y-5} ${x+3} ${y-2}Q${x+5} ${y+3} ${x} ${y+3}" stroke="${sh(c,.45)}" stroke-opacity=".4" stroke-width="1.2" fill="none"/>`;
const HAIR={
 long:{n:'Long',t:['fancy'],back:c=>HVS('M66 56Q60 16 100 16Q140 16 134 56Q138 100 144 150Q148 176 136 186Q124 190 116 182Q106 190 96 184Q84 190 74 184Q60 188 56 172Q60 140 62 100Q63 78 66 56Z',c,['M72 60Q64 120 62 176','M128 60Q136 120 140 176','M70 70Q66 120 70 170','M80 70Q76 130 80 182','M120 70Q124 130 122 182','M130 70Q134 120 132 170']),
  front:c=>fCenter(c)+BOTH(HVS(LOCK_L,c,['M72 80Q66 120 70 160','M74 90Q70 130 75 168','M71 78Q66 110 68 140']))},

function gemPath(ctx,shape,r){ctx.beginPath();
 if(shape==='round')ctx.arc(0,0,r,0,Math.PI*2);
 else if(shape==='heart'){const s=r*.95;ctx.moveTo(0,s*.9);ctx.bezierCurveTo(-s*1.6,-s*.2,-s*.6,-s*1.3,0,-s*.4);ctx.bezierCurveTo(s*.6,-s*1.3,s*1.6,-s*.2,0,s*.9)}
 else if(shape==='star'){for(let q=0;q<10;q++){const a=-Math.PI/2+q*Math.PI/5,rr2=q%2?r*.48:r*1.12;ctx.lineTo(rr2*Math.cos(a),rr2*Math.sin(a))}}
 else{ctx.moveTo(0,-r*1.25);ctx.quadraticCurveTo(r*.95,-r*.1,r*.85,r*.35);ctx.arc(0,r*.3,r*.86,0,Math.PI);ctx.quadraticCurveTo(-r*.95,-r*.1,0,-r*1.25)}
 ctx.closePath()}
function drawGem(ctx,s,t){
 ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.r||0);const r=s.size/2,col=s.col;
 let fillBase;
 if(col==='rainbow'){fillBase=ctx.createLinearGradient(-r,-r,r,r);['#ff595e','#ffca3a','#8ac926','#1982c4','#6a4c93'].forEach((c,i)=>fillBase.addColorStop(i/4,c))}
 else{fillBase=ctx.createRadialGradient(-r*.35,-r*.4,r*.1,0,0,r*1.1);fillBase.addColorStop(0,mix(col,'#ffffff',.75));fillBase.addColorStop(.45,col);fillBase.addColorStop(1,sh(col,-.4))}
 ctx.shadowColor='rgba(40,20,50,.35)';ctx.shadowBlur=2.5;ctx.shadowOffsetY=1.5;
 gemPath(ctx,s.shape,r);ctx.fillStyle=fillBase;ctx.fill();ctx.shadowColor='transparent';
 if(col==='rainbow'){const g=ctx.createRadialGradient(-r*.35,-r*.4,0,0,0,r);g.addColorStop(0,'rgba(255,255,255,.75)');g.addColorStop(.5,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(0,0,0,.25)');ctx.fillStyle=g;ctx.fill()}
 ctx.strokeStyle=col==='rainbow'?'rgba(58,31,77,.5)':sh(col,-.45);ctx.lineWidth=.8;ctx.stroke();
 ctx.save();ctx.scale(.52,.52);gemPath(ctx,s.shape,r);ctx.restore();ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=.6;ctx.stroke();
 if(s.shape==='round'){ctx.beginPath();for(let q=0;q<8;q++){const a=q*Math.PI/4;ctx.moveTo(r*.52*Math.cos(a),r*.52*Math.sin(a));ctx.lineTo(r*Math.cos(a),r*Math.sin(a))}ctx.strokeStyle='rgba(255,255,255,.35)';ctx.stroke()}
 ctx.beginPath();ctx.ellipse(-r*.32,-r*.38,r*.26,r*.16,-.6,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.85)';ctx.fill();
 const tw=Math.max(0,Math.sin(t/260+s.ph));if(tw>.55){const k=(tw-.55)/.45*r*.9;ctx.globalAlpha=(tw-.55)/.45;ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(r*.3-k,-r*.45);ctx.lineTo(r*.3+k,-r*.45);ctx.moveTo(r*.3,-r*.45-k);ctx.lineTo(r*.3,-r*.45+k);ctx.stroke()}
 ctx.restore()}

function pattern(kind){

 if(kind==='hearts'){for(let y=10;y<CH;y+=40)for(let x=(Math.round(y/40)%2?10:30);x<CW;x+=40){pc.fillStyle=col();const s=8;pc.beginPath();pc.moveTo(x,y+s*.9);pc.bezierCurveTo(x-s*1.6,y-s*.2,x-s*.6,y-s*1.3,x,y-s*.4);pc.bezierCurveTo(x+s*.6,y-s*1.3,x+s*1.6,y-s*.2,x,y+s*.9);pc.fill()}}
 if(kind==='stars'){for(let y=10;y<CH;y+=42)for(let x=(Math.round(y/42)%2?10:32);x<CW;x+=44){pc.fillStyle=col();pc.beginPath();for(let q=0;q<10;q++){const a=-Math.PI/2+q*Math.PI/5,r=q%2?4:10;pc.lineTo(x+r*Math.cos(a),y+r*Math.sin(a))}pc.closePath();pc.fill()}}

/* ---- jobs: flow ---- */
function clearScene(){DR.objs.forEach(o=>o.g.parent&&o.g.parent.remove(o.g));DR.objs=[];DR.junk.forEach(j=>j.g.parent&&j.g.parent.remove(j.g));DR.junk=[];DR.tips.forEach(s=>s.parent&&s.parent.remove(s));DR.tips=[];
 if(DR.pile){DR.sc.remove(DR.pile);DR.pile=null}DR.sel=null;DR.selO=null;DR.selJunk=null;DR.ring.visible=false;DR.queue=[];hiStore=null}
async function enterDecor(){show('decor');$('#dLoad').hidden=!!DR;if(!DR){try{await loadThree();d3init()}catch(e){$('#dLoad').textContent='Couldn’t load the 3D room. Check the internet connection and try again.';return false}$('#dLoad').hidden=true}d3start();return true}
async function startJob(job){dload();if(!await enterDecor())return;clearScene();DR.job=job;DR.mode='job';DR.orbit=defOrbit();DR.choice={};
 setWall('old');setFloor('old');
 job.junk.forEach(([k,kind,x,z],i)=>{const g=JUNK[k]();g.position.set(x,0,z);g.rotation.y=(i*1.7)%6;g.traverse(m=>{if(m.isMesh){m.castShadow=m.receiveShadow=true}});DR.sc.add(g);DR.junk.push({g,kind,k})});
 const cob=sprite('🕸️',.7);cob.position.set(-2.6,2.8,-2.6);cob.userData={t0:0,y0:2.8,keep:1};DR.sc.add(cob);DR.tips.push(cob);DR.cob=cob;
 DR.phase='clear';d3panel();d3ctl();toast(`${job.client}: “${job.say}”`)}
function selectJunk(j){DR.selJunk=j;DR.sel=null;const r=DR.ring;const b=new THREE.Box3().setFromObject(j.g),s=b.getSize(new THREE.Vector3());const rad=Math.max(s.x,s.z)*.65;r.scale.set(rad,rad,rad);r.position.set(j.g.position.x,.03,j.g.position.z);r.visible=true;ringColor(true);
 const y0=j.g.position.y;anim(300,k=>{j.g.position.y=y0+Math.sin(k*Math.PI)*.15});tone(600,.05);d3panel()}
function sortJunk(bin){const j=DR.selJunk;if(!j)return;if(j.kind!==bin){toast(bin==='trash'?'That’s still good! Put it in the keep box.':'That’s broken. It goes in the trash.');tone(250,.12,'triangle');const x0=j.g.position.x;anim(300,k=>{j.g.position.x=x0+Math.sin(k*Math.PI*6)*.06*(1-k)});return}
 DR.selJunk=null;DR.ring.visible=false;const p0=j.g.position.clone();tone(bin==='trash'?330:760,.12,'triangle');
 anim(450,k=>{j.g.position.set(p0.x,p0.y+k*1.6,p0.z);j.g.scale.setScalar(Math.max(.01,1-k));if(k>=1)DR.sc.remove(j.g)});DR.junk=DR.junk.filter(x=>x!==j);
 if(!DR.junk.length){setTimeout(()=>{DR.sc.remove(DR.cob);DR.tips=DR.tips.filter(s=>s!==DR.cob);DR.phase='style';DR.pickI=0;applyPickDefault();fanfare();d3panel()},500)}else d3panel()}
function applyPickDefault(){const [what,opts]=DR.job.pick[DR.pickI];choosePick(what,opts[0],true)}
function choosePick(what,v,silent){DR.choice[what]=v;if(what==='wall')setWall(v);else if(what==='floor')setFloor(v);else{if(DR.preview){DR.sc.remove(DR.preview)}const g=buildItem(what,v);g.position.set(.4,0,.3);g.rotation.y=-.3;DR.sc.add(g);DR.preview=g;anim(350,k=>g.scale.setScalar(.3+.7*easeOutBack(k)))}if(!silent)tone(700,.06,'triangle');d3panel()}
function nextPick(){DR.pickI++;if(DR.preview&&DR.job.pick[DR.pickI-1][0]!=='wall'&&DR.job.pick[DR.pickI-1][0]!=='floor'){DR.sc.remove(DR.preview);DR.preview=null}
 if(DR.pickI<DR.job.pick.length){applyPickDefault();return}
 DR.phase='furn';DR.queue=DR.job.furn.map(([k,vi,rule])=>({k,vi:vi==null?(DR.choice[k]!=null?DR.choice[k]:0):vi,rule}));buildPile();tone(880,.1,'triangle');toast('Tap the boxes to unpack the furniture!');d3panel()}
function buildPile(){if(DR.pile)DR.sc.remove(DR.pile);const g=new THREE.Group();const n=Math.min(4,DR.queue.length);
 for(let i=0;i<n;i++){const b=Gp();b.add(bx(.62,.42,.5,'#c79a5b',0,.21,0,.012));b.add(bx(.63,.012,.08,'#e6c58f',0,.425,0,.003));b.add(bx(.2,.1,.005,'#ffffff',0,.24,.252,.002));b.position.set((i%2)*.15-.05,i*.43,(i%2)*.05);b.rotation.y=i*.25;g.add(b)}
 g.position.set(2.3,0,2.3);g.traverse(m=>{if(m.isMesh){m.castShadow=m.receiveShadow=true}});g.visible=n>0;DR.sc.add(g);DR.pile=g}
function unbox(){if(!DR.queue.length)return;const q=DR.queue.shift(),g=buildItem(q.k,q.vi),u=g.userData;const o={g,rule:q.rule,placed:true};DR.objs.push(o);DR.itemsRoot.add(g);
 if(u.wall)findWallSpot(g);else if(u.sm){g.position.set(rnd(1,1.8),0,rnd(1,1.8))}else{if(!findSpot(g)){g.position.set(0,0,0)}}
 const top=DR.pile.children[DR.pile.children.length-1];if(top){const p0=top.position.clone();anim(350,k=>{top.position.y=p0.y+k*.6;top.scale.setScalar(Math.max(.01,1-k))})}
 g.scale.setScalar(.01);anim(500,k=>g.scale.setScalar(Math.max(.01,easeOutBack(k))));
 const pp=new THREE.Vector3(2.3,1,2.3);for(let i=0;i<3;i++){const s=sprite(['✨','🎉','⭐'][i],.35);s.position.copy(pp).add(new THREE.Vector3(rnd(-.4,.4),rnd(0,.5),rnd(-.4,.4)));s.userData={t0:performance.now(),y0:s.position.y};DR.sc.add(s);DR.tips.push(s)}
 setTimeout(()=>buildPile(),360);[523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.08,'triangle',.06),i*70));select(o);d3panel()}
function finishFurn(){DR.phase='small';DR.queue=DR.job.small.map(([k,vi,rule])=>({k,vi,rule}));buildPile();select(null);tone(880,.1,'triangle');toast('Now unpack the little things!');d3panel()}
function completeJob(){const job=DR.job;let sum=0;const objs=DR.objs;objs.forEach(o=>{const r=rateObj(o);sum+={love:1,ok:.6,meh:.15}[r];showTip(o,r,true)});
 const score=sum/Math.max(1,objs.length),stars3=score>=.85?3:score>=.62?2:1;DR.phase='done';select(null);
 const prev=DS.best[job.id]||0;DS.best[job.id]=Math.max(prev,stars3);const reward=pick(REWARDS);DS.inv[reward]=(DS.inv[reward]||0)+1;dsave();addStars(stars3);
 const [rk,rv]=reward.split(':');DR.result={stars:stars3,reward:{k:rk,vi:+rv},score};stars3===3?fanfare():tone(600,.2,'triangle');d3panel()}

/* ---- my home ---- */
async function openHome(){dload();if(!await enterDecor())return;clearScene();DR.job=null;DR.mode='home';DR.phase='home';DR.homeTab='items';DR.orbit=defOrbit();
 const H=DS.home||{wall:'lavender',floor:'honey',items:[]};setWall(H.wall);setFloor(H.floor);
 const made=[];(H.items||[]).forEach(r=>{const g=buildItem(r.k,r.v),o={g,placed:true};DR.objs.push(o);made.push(o);
  if(r.p==null){DR.itemsRoot.add(g);if(g.userData.wall){setWallSide(g,r.side||'back')}g.position.set(r.x,r.y,r.z);g.rotation.y=r.ry||0}});
 (H.items||[]).forEach((r,i)=>{if(r.p==null)return;const o=made[i],par=made[r.p];if(!par){DR.itemsRoot.add(o.g);o.g.position.set(r.x,0,r.z);return}par.g.add(o.g);o.g.position.set(r.x,r.y,r.z);o.g.rotation.y=r.ry||0;o.parent=par;if(r.st){o.stored=true;o.g.visible=false}});
 d3panel();d3ctl()}
let homeT=null;function homeSave(){clearTimeout(homeT);homeT=setTimeout(()=>{if(DR.mode!=='home')return;const items=DR.objs.map(o=>{const g=o.g;return {k:g.userData.kind,v:g.userData.vi,x:+g.position.x.toFixed(3),y:+g.position.y.toFixed(3),z:+g.position.z.toFixed(3),ry:+g.rotation.y.toFixed(3),side:g.userData.side,p:o.parent?DR.objs.indexOf(o.parent):null,st:o.stored?1:0}});
 DS.home={wall:DR.wallKey,floor:DR.floorKey,items};dsave()},250)}
function homeAdd(key){if(!DS.inv[key])return;const [k,v]=key.split(':');DS.inv[key]--;if(!DS.inv[key])delete DS.inv[key];dsave();const g=buildItem(k,+v),u=g.userData,o={g,placed:true};DR.objs.push(o);DR.itemsRoot.add(g);
 if(u.wall)findWallSpot(g);else if(u.sm)g.position.set(rnd(-.5,.5),0,rnd(.5,1.2));else if(!findSpot(g))g.position.set(0,0,0);
 g.scale.setScalar(.01);anim(450,kk=>g.scale.setScalar(Math.max(.01,easeOutBack(kk))));select(o);tone(760,.08,'triangle');homeSave();d3panel()}
function homePutAway(){const o=DR.selO;if(!o)return;const rm=x=>{DR.objs.filter(c=>c.parent===x).forEach(rm);const key=x.g.userData.kind+':'+x.g.userData.vi;DS.inv[key]=(DS.inv[key]||0)+1;x.g.parent&&x.g.parent.remove(x.g);DR.objs=DR.objs.filter(y=>y!==x)};
 rm(o);dsave();select(null);homeSave();tone(420,.08,'triangle');d3panel()}
function rotateSel(){const o=DR.selO;if(!o)return;const g=o.g,u=g.userData;if(u.wall)return;const before=g.rotation.y;g.rotation.y+=Math.PI/2;if(!u.sm){clampFloor(g);if(!floorValid(g)){g.rotation.y=before;clampFloor(g);toast('No room to turn it here. Move it first!');tone(260,.1,'triangle');return}}
 const r0=g.rotation.y;anim(200,k=>{g.rotation.y=r0-(1-k)*Math.PI/2*(1-k)});tone(600,.05);selRing(g);afterPlace(o)}

/* ---- panels ---- */
const dstep={clear:'Step 1 of 4 · Clear out the old stuff',style:'Step 2 of 4 · Pick the style',furn:'Step 3 of 4 · Place the furniture',small:'Step 4 of 4 · Unpack the little things',done:'All done!',home:'My Home'};
function d3ctl(){const o=DR&&DR.selO,c=$('#dCtl');if(!o||(DR.phase!=='furn'&&DR.phase!=='small'&&DR.phase!=='home')){c.innerHTML='';return}
 const u=o.g.userData;c.innerHTML=(u.wall?'':`<button class="dbtn" data-d="rot" aria-label="Turn">↻</button>`)+(DR.mode==='home'?`<button class="dbtn" data-d="away" aria-label="Put away">📦</button>`:'')}
function d3panel(){if(!DR)return;const ph=DR.phase,P=$('#dPanel');$('#dStep').textContent=DR.mode==='home'?'My Home':(DR.job?`${DR.job.client}’s ${DR.job.room.toLowerCase()}`:'')+' — '+(dstep[ph]||'');d3ctl();
 if(ph==='clear'){const sel=DR.selJunk;P.innerHTML=`<p class="hint">${sel?'Where does it go?':'Tap something old, then pick where it goes.'} <b>${DR.junk.length} left</b></p><div class="bins"><button class="bin trash" data-d="trash" ${sel?'':'disabled'}><span>🗑️</span>Trash</button><button class="bin keep" data-d="keep" ${sel?'':'disabled'}><span>📦</span>Keep box</button></div>`;return}
 if(ph==='style'){const [what,opts]=DR.job.pick[DR.pickI],cur=DR.choice[what];const title=what==='wall'?'Pick the walls':what==='floor'?'Pick the floor':'Pick the '+DNAMES[what].toLowerCase();
  P.innerHTML=`<p class="hint">${title} <b>(${DR.pickI+1} of ${DR.job.pick.length})</b></p><div class="dopts">`+opts.map(v=>{const img=what==='wall'||what==='floor'?swatch(what,v):dthumb(what,v),nm=what==='wall'?WALLS[v].n:what==='floor'?FLOORS[v].n:VARS[what][v].n;return `<button class="dopt${cur===v?' on':''}" data-d="pick" data-v="${v}"><img src="${img}" alt=""><span>${nm}</span></button>`}).join('')+`</div><button class="btn pink" data-d="next">Next</button>`;return}
 if(ph==='furn'||ph==='small'){const left=DR.queue.length,label=ph==='furn'?'furniture':'little things';
  P.innerHTML=`<p class="hint">${left?`Tap the boxes to unpack the ${label}. Drag things to move them.`:ph==='furn'?'Move things around until it looks just right.':'Put the little things on tables and shelves. Drag clothes and toys onto a dresser or chest to put them away.'}</p>`+
   (left?`<div class="row"><button class="btn white" data-d="unbox">📦 Open a box (${left} left)</button></div>`:(ph==='furn'?`<div class="row"><button class="btn pink" data-d="tosmall">Next: unpack the little things</button></div>`:`<div class="row"><button class="btn pink" data-d="complete">Complete!</button></div>`));return}
 if(ph==='done'){const r=DR.result,j=DR.job,line=r.stars===3?'I LOVE it! It’s perfect!':r.stars===2?'I really like it! A few things could go somewhere better.':'Thanks! Some things are in funny spots though.';
  P.innerHTML=`<div class="dres"><div class="dclient">${clientFace(j.look,r.stars===1?'sad':'grin')}</div><div class="dsay"><b>${j.client}</b><p>${line}</p><div class="dstars">${[1,2,3].map(i=>`<span class="${i<=r.stars?'on':''}">★</span>`).join('')}</div></div></div>
  <div class="prize"><img src="${dthumb(r.reward.k,r.reward.vi)}" alt="" style="width:44px;height:44px">New for your home: ${VARS[r.reward.k][r.reward.vi].n} ${DNAMES[r.reward.k].toLowerCase()}! &middot; +${r.stars}★</div>
  <div class="row"><button class="btn white" data-d="map">Map</button><button class="btn mint" data-d="home">My Home</button></div>`;return}
 if(ph==='home'){const tab=DR.homeTab||'items';let h=`<div class="dtabs">${[['items','Items'],['walls','Walls'],['floors','Floors']].map(([k,n])=>`<button class="tab${tab===k?' on':''}" data-d="htab" data-v="${k}">${n}</button>`).join('')}</div>`;
  if(tab==='items'){const keys=Object.keys(DS.inv).filter(k=>DS.inv[k]>0);h+=keys.length?`<div class="dopts inv">`+keys.map(k=>{const [kk,v]=k.split(':');return `<button class="dopt" data-d="add" data-v="${k}"><img src="${dthumb(kk,+v)}" alt=""><span>${DNAMES[kk]}${DS.inv[k]>1?' ×'+DS.inv[k]:''}</span></button>`}).join('')+`</div>`:`<p class="hint">Everything is out! Finish design jobs to win more furniture.</p>`}
  else{const set=tab==='walls'?WALLS:FLOORS,kind=tab==='walls'?'wall':'floor',cur=tab==='walls'?DR.wallKey:DR.floorKey;h+=`<div class="dopts">`+Object.keys(set).filter(k=>k!=='old').map(k=>`<button class="dopt${cur===k?' on':''}" data-d="${kind}" data-v="${k}"><img src="${swatch(kind,k)}" alt=""><span>${set[k].n}</span></button>`).join('')+`</div>`}
  P.innerHTML=h}}
function clientFace(look,mood){const keep=L,km=MOOD;L=Object.assign({},DEF,look);repairLook();MOOD=mood||'smile';const s=charSVG().replace('viewBox="0 0 200 400"','viewBox="52 2 96 120"');L=keep;MOOD=km;return s}
$('#dPanel').addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(!b||b.disabled)return;const a=b.dataset.d,v=b.dataset.v;
 if(a==='trash'||a==='keep')return sortJunk(a);
 if(a==='pick'){const what=DR.job.pick[DR.pickI][0];return choosePick(what,what==='wall'||what==='floor'?v:+v)}
 if(a==='next')return nextPick();
 if(a==='unbox')return unbox();
 if(a==='tosmall')return finishFurn();
 if(a==='complete')return completeJob();
 if(a==='map')return openDecorMap();
 if(a==='home')return openHome();
 if(a==='htab'){DR.homeTab=v;tone(520,.04);return d3panel()}
 if(a==='add')return homeAdd(v);
 if(a==='wall'){setWall(v);homeSave();tone(700,.06,'triangle');return d3panel()}
 if(a==='floor'){setFloor(v);homeSave();tone(700,.06,'triangle');return d3panel()}});
$('#dCtl').addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(!b)return;if(b.dataset.d==='rot')rotateSel();if(b.dataset.d==='away')homePutAway()});
$('#dBack').onclick=()=>{tone(440);openDecorMap()};

/* ---- map ---- */
function openDecorMap(){dload();if(DR)DR.active=false;show('decorMap');
 $('#jobs').innerHTML=`<button class="jcard home" data-job="home"><div class="jart">🏡</div><div class="jtxt"><b>My Home</b><span>Decorate your own room with everything you win</span></div></button>`+
  JOBS.map(j=>`<button class="jcard" data-job="${j.id}"><div class="jart face">${clientFace(j.look,'smile')}</div><div class="jtxt"><b>${j.client}’s ${j.room.toLowerCase()}</b><span>“${j.say}”</span><span class="jst">${[1,2,3].map(i=>`<i class="${i<=(DS.best[j.id]||0)?'on':''}">★</i>`).join('')}</span></div></button>`).join('')}
$('#jobs').addEventListener('click',e=>{const b=e.target.closest('[data-job]');if(!b)return;tone(700);if(b.dataset.job==='home')return openHome();startJob(JOBS.find(j=>j.id===b.dataset.job))});
$('#goDecor').onclick=()=>{tone(700);openDecorMap()};

/* ---------- player picker ---------- */
let pEdit=false,pAdding=false;
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function lookFor(id){const keep=L;L=Object.assign({},DEF,store.get(`glam_${id}_look`,{}));repairLook();MOOD='smile';const svg=charSVG();L=keep;return svg}
function openPlayers(){show('players');renderPlayers()}
function renderPlayers(){
 let h=PROFILES.map(p=>{const st=store.get(`glam_${p.id}_stars`,0)+(store.get(`glam_${p.id}_unlocked`,null)?0:5),col=PCOL[p.c%PCOL.length];
  if(pEdit)return `<div class="pcard" style="--pc:${col}"><div class="band">${lookFor(p.id)}</div><input id="pn_${p.id}" maxlength="14" value="${esc(p.name)}" aria-label="Name"><div class="acts"><button class="go" data-save="${p.id}">Save</button>${PROFILES.length>1?`<button data-del="${p.id}">Remove</button>`:''}</div></div>`;
  return `<button class="pcard" data-p="${p.id}" style="--pc:${col}"><div class="band">${lookFor(p.id)}</div><b>${esc(p.name)}</b><small>★ ${st} stars</small></button>`}).join('');
 if(PROFILES.length<6)h+=pAdding?`<div class="pcard add"><span>New player</span><input id="pn_new" maxlength="14" placeholder="Name" aria-label="New player name"><div class="acts"><button class="go" data-add>Add</button><button data-cancel>Cancel</button></div></div>`:`<button class="pcard add" data-new><span class="plus">+</span>Add player</button>`;
 $('#pgrid').innerHTML=h;$('#editPlayers').textContent=pEdit?'Done editing':'Edit players';
 const ni=$('#pn_new');if(ni)ni.focus();
}
$('#editPlayers').onclick=()=>{pEdit=!pEdit;pAdding=false;tone(520);renderPlayers()};
$('#pgrid').addEventListener('click',e=>{
 const t=e.target;let b;
 if(b=t.closest('[data-p]')){tone(760);loadProfile(b.dataset.p);fanfare();show('home');return}
 if(t.closest('[data-new]')){pAdding=true;renderPlayers();return}
 if(t.closest('[data-cancel]')){pAdding=false;renderPlayers();return}
 if(t.closest('[data-add]')){const n=$('#pn_new').value.trim();if(!n){toast('Type a name first');return}
  const id='p'+Date.now().toString(36);PROFILES.push({id,name:n,c:PROFILES.length});store.set('glam_profiles',PROFILES);pAdding=false;tone(880);renderPlayers();return}
 if(b=t.closest('[data-save]')){const n=$('#pn_'+b.dataset.save).value.trim();if(!n){toast('Names can\u2019t be blank');return}
  PROFILES.find(p=>p.id===b.dataset.save).name=n;store.set('glam_profiles',PROFILES);toast('Saved');tone(700);return}
 if(b=t.closest('[data-del]')){if(!b.classList.contains('sure')){b.classList.add('sure');b.textContent='Tap to remove';return}
  const id=b.dataset.del;PROFILES=PROFILES.filter(p=>p.id!==id);store.set('glam_profiles',PROFILES);
  ['stars','look','unlocked','cases'].forEach(k=>{try{localStorage.removeItem(`glam_${id}_${k}`)}catch(_){}});
  if(CURP===id)loadProfile(PROFILES[0].id);renderPlayers()}
});
$('#pgrid').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pn_new')$('[data-add]').click()});
$('#pchip').onclick=()=>{tone(600);pEdit=false;pAdding=false;openPlayers()};
openPlayers();
</script>

</body>
